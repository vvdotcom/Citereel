<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="1260" viewBox="0 0 2600 1260" role="img" aria-labelledby="title description">
<title id="title">Agent lifecycle and policy hooks</title><desc id="description">The actual ProductionPolicy callbacks: BeforeModelCallEvent, BeforeToolCallEvent and AfterToolCallEvent.</desc>
<defs>
<marker id="arrow24313f" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#24313f" stroke-width="2"/></marker>
<marker id="arrow6b9c7c" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#6b9c7c" stroke-width="2"/></marker>
<marker id="arrow718ec4" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#718ec4" stroke-width="2"/></marker>
<marker id="arrow9a7ac5" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#9a7ac5" stroke-width="2"/></marker>
<marker id="arrowc89b58" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#c89b58" stroke-width="2"/></marker>
<marker id="arrowc7837b" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#c7837b" stroke-width="2"/></marker>
<marker id="arrow8995a3" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#8995a3" stroke-width="2"/></marker>
</defs>
<rect width="100%" height="100%" fill="white"/>
<text x="64" y="70" font-family="Arial, Helvetica, sans-serif" font-size="38" fill="#24313f" text-anchor="start" font-weight="700">
<tspan x="64" dy="0">Agent lifecycle and policy hooks</tspan>
</text>
<text x="64" y="112" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#5c6b7a" text-anchor="start" font-weight="400">
<tspan x="64" dy="0">The actual ProductionPolicy callbacks: BeforeModelCallEvent, BeforeToolCallEvent and AfterToolCallEvent.</tspan>
</text>
<text x="2536" y="72" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#5c6b7a" text-anchor="end" font-weight="600">
<tspan x="2536" dy="0">CITEREEL / 04</tspan>
</text>
<rect x="60" y="320" width="200" height="160" rx="6" fill="#eaf5ed" stroke="#6b9c7c" stroke-width="2"/>
<text x="160.0" y="356" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#24313f" text-anchor="middle" font-weight="600">
<tspan x="160.0" dy="0">Invocation</tspan>
</text>
<text x="160.0" y="397" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#5c6b7a" text-anchor="middle" font-weight="400">
<tspan x="160.0" dy="0">Active job,</tspan>
<tspan x="160.0" dy="25">attempt + session</tspan>
</text>
<rect x="330" y="320" width="280" height="160" rx="6" fill="#edf3ff" stroke="#718ec4" stroke-width="2"/>
<text x="470.0" y="356" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#24313f" text-anchor="middle" font-weight="600">
<tspan x="470.0" dy="0">BeforeModelCallEvent</tspan>
</text>
<text x="470.0" y="397" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#5c6b7a" text-anchor="middle" font-weight="400">
<tspan x="470.0" dy="0">Check cancellation,</tspan>
<tspan x="470.0" dy="25">human decision + budget</tspan>
</text>
<rect x="690" y="320" width="220" height="160" rx="6" fill="#f2ecfb" stroke="#9a7ac5" stroke-width="2"/>
<text x="800.0" y="356" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#24313f" text-anchor="middle" font-weight="600">
<tspan x="800.0" dy="0">Bedrock model</tspan>
</text>
<text x="800.0" y="397" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#5c6b7a" text-anchor="middle" font-weight="400">
<tspan x="800.0" dy="0">Reason and</tspan>
<tspan x="800.0" dy="25">request a tool</tspan>
</text>
<rect x="990" y="320" width="280" height="160" rx="6" fill="#fff7e6" stroke="#c89b58" stroke-width="2"/>
<text x="1130.0" y="356" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#24313f" text-anchor="middle" font-weight="600">
<tspan x="1130.0" dy="0">BeforeToolCallEvent</tspan>
</text>
<text x="1130.0" y="397" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#5c6b7a" text-anchor="middle" font-weight="400">
<tspan x="1130.0" dy="0">Count call; check</tspan>
<tspan x="1130.0" dy="25">state + prerequisites</tspan>
</text>
<path d="M1410,323 L1490,400 L1410,477 L1330,400 Z" fill="#fff7e6" stroke="#c89b58" stroke-width="2"/>
<text x="1410" y="396" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#24313f" text-anchor="middle" font-weight="600">
<tspan x="1410" dy="0">Tool</tspan>
<tspan x="1410" dy="28">allowed?</tspan>
</text>
<rect x="1560" y="320" width="220" height="160" rx="6" fill="#eaf5ed" stroke="#6b9c7c" stroke-width="2"/>
<text x="1670.0" y="356" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#24313f" text-anchor="middle" font-weight="600">
<tspan x="1670.0" dy="0">Execute tool</tspan>
</text>
<text x="1670.0" y="397" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#5c6b7a" text-anchor="middle" font-weight="400">
<tspan x="1670.0" dy="0">Run the selected</tspan>
<tspan x="1670.0" dy="25">scoped function</tspan>
</text>
<rect x="1870" y="320" width="280" height="160" rx="6" fill="#edf3ff" stroke="#718ec4" stroke-width="2"/>
<text x="2010.0" y="356" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#24313f" text-anchor="middle" font-weight="600">
<tspan x="2010.0" dy="0">AfterToolCallEvent</tspan>
</text>
<text x="2010.0" y="397" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#5c6b7a" text-anchor="middle" font-weight="400">
<tspan x="2010.0" dy="0">Verify actual result</tspan>
<tspan x="2010.0" dy="25">and tool postcondition</tspan>
</text>
<rect x="2340" y="320" width="200" height="160" rx="6" fill="#eaf5ed" stroke="#6b9c7c" stroke-width="2"/>
<text x="2440.0" y="356" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#24313f" text-anchor="middle" font-weight="600">
<tspan x="2440.0" dy="0">Tool result</tspan>
</text>
<text x="2440.0" y="397" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#5c6b7a" text-anchor="middle" font-weight="400">
<tspan x="2440.0" dy="0">Return feedback</tspan>
<tspan x="2440.0" dy="25">to the agent</tspan>
</text>
<path d="M260,400 L330,400" fill="none" stroke="#24313f" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow24313f)"/>
<path d="M610,400 L690,400" fill="none" stroke="#24313f" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow24313f)"/>
<path d="M910,400 L990,400" fill="none" stroke="#24313f" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow24313f)"/>
<path d="M1270,400 L1330,400" fill="none" stroke="#24313f" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow24313f)"/>
<path d="M1490,400 L1560,400" fill="none" stroke="#24313f" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow24313f)"/>
<path d="M1780,400 L1870,400" fill="none" stroke="#24313f" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow24313f)"/>
<path d="M2150,400 L2340,400" fill="none" stroke="#24313f" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow24313f)"/>
<text x="1522" y="378" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#6b9c7c" text-anchor="middle" font-weight="400">
<tspan x="1522" dy="0">Yes</tspan>
</text>
<rect x="340" y="580" width="260" height="140" rx="6" fill="#fff0ee" stroke="#c7837b" stroke-width="2"/>
<text x="470.0" y="616" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#24313f" text-anchor="middle" font-weight="600">
<tspan x="470.0" dy="0">Stop model call</tspan>
</text>
<text x="470.0" y="657" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#5c6b7a" text-anchor="middle" font-weight="400">
<tspan x="470.0" dy="0">Human decision,</tspan>
<tspan x="470.0" dy="25">cancellation or budget</tspan>
</text>
<path d="M470,480 L470,580" fill="none" stroke="#c7837b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrowc7837b)" stroke-dasharray="8 6"/>
<rect x="483.0" y="517" width="86" height="28" rx="0" fill="white" stroke="none" stroke-width="0"/>
<text x="526" y="537" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#c7837b" text-anchor="middle" font-weight="400">
<tspan x="526" dy="0">Blocked</tspan>
</text>
<rect x="1280" y="580" width="260" height="140" rx="6" fill="#fff0ee" stroke="#c7837b" stroke-width="2"/>
<text x="1410.0" y="616" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#24313f" text-anchor="middle" font-weight="600">
<tspan x="1410.0" dy="0">Cancel tool</tspan>
</text>
<text x="1410.0" y="657" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#5c6b7a" text-anchor="middle" font-weight="400">
<tspan x="1410.0" dy="0">Set cancel_tool</tspan>
<tspan x="1410.0" dy="25">with the rejection reason</tspan>
</text>
<path d="M1410,477 L1410,580" fill="none" stroke="#c7837b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrowc7837b)" stroke-dasharray="8 6"/>
<rect x="1425.0" y="517" width="36" height="28" rx="0" fill="white" stroke="none" stroke-width="0"/>
<text x="1443" y="537" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#c7837b" text-anchor="middle" font-weight="400">
<tspan x="1443" dy="0">No</tspan>
</text>
<path d="M1540,650 L2010,650 L2010,480" fill="none" stroke="#c7837b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrowc7837b)" stroke-dasharray="8 6"/>
<rect x="1671.0" y="612" width="226" height="28" rx="0" fill="white" stroke="none" stroke-width="0"/>
<text x="1784" y="632" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#c7837b" text-anchor="middle" font-weight="400">
<tspan x="1784" dy="0">Cancellation recorded</tspan>
</text>
<path d="M2440,480 L2440,790 L288,790 L288,267 L470,267 L470,320" fill="none" stroke="#9a7ac5" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow9a7ac5)"/>
<rect x="1087.0" y="754" width="686" height="28" rx="0" fill="white" stroke="none" stroke-width="0"/>
<text x="1430" y="774" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#9a7ac5" text-anchor="middle" font-weight="400">
<tspan x="1430" dy="0">Next model iteration receives tool results or cancellation feedback</tspan>
</text>
<rect x="60" y="865" width="810" height="210" rx="6" fill="#fff7e6" stroke="#c89b58" stroke-width="2"/>
<text x="465.0" y="901" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#24313f" text-anchor="middle" font-weight="600">
<tspan x="465.0" dy="0">Before tool execution</tspan>
</text>
<text x="465.0" y="942" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#5c6b7a" text-anchor="middle" font-weight="400">
<tspan x="465.0" dy="0">Allow at most 10 calls. Block calls after a plan is saved</tspan>
<tspan x="465.0" dy="25">or a human decision is pending. Read the brief and inspect</tspan>
<tspan x="465.0" dy="25">the site before submit_storyboard may run.</tspan>
</text>
<rect x="915" y="865" width="810" height="210" rx="6" fill="#edf3ff" stroke="#718ec4" stroke-width="2"/>
<text x="1320.0" y="901" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#24313f" text-anchor="middle" font-weight="600">
<tspan x="1320.0" dy="0">After tool execution</tspan>
</text>
<text x="1320.0" y="942" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#5c6b7a" text-anchor="middle" font-weight="400">
<tspan x="1320.0" dy="0">Check exceptions, cancellation and result status. A rejected</tspan>
<tspan x="1320.0" dy="25">storyboard is not a successful submission until a plan exists.</tspan>
<tspan x="1320.0" dy="25">Only successful postconditions satisfy prerequisites.</tspan>
</text>
<rect x="1770" y="865" width="810" height="210" rx="6" fill="#eaf5ed" stroke="#6b9c7c" stroke-width="2"/>
<text x="2175.0" y="901" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#24313f" text-anchor="middle" font-weight="600">
<tspan x="2175.0" dy="0">Attempt fencing and audit</tspan>
</text>
<text x="2175.0" y="942" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#5c6b7a" text-anchor="middle" font-weight="400">
<tspan x="2175.0" dy="0">AttemptStore checks owner, active attempt, planning state,</tspan>
<tspan x="2175.0" dy="25">cancellation and session ID before state access. Policy</tspan>
<tspan x="2175.0" dy="25">receipts record passed or blocked outcomes in job state.</tspan>
</text>
<path d="M64,1156 H2536" stroke="#d9e0e6"/>
<text x="64" y="1190" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#5c6b7a" text-anchor="start" font-weight="400">
<tspan x="64" dy="0">These are policy decisions, not an in-tool user approval dialog. Creator plan/export approvals happen through the API and studio.</tspan>
<tspan x="64" dy="27">Source: services/agent/src/launchpad_agent/policies.py and runtime.py.</tspan>
</text>
</svg>