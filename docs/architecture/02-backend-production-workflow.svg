<tspan x="1325.0" dy="25">Renew job lease</tspan>
</text>
<path d="M1470,312 L1550,312" fill="none" stroke="#24313f" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow24313f)"/>
