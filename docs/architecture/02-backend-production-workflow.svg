<text x="64" y="70" font-family="Arial, Helvetica, sans-serif" font-size="38" fill="#24313f" text-anchor="start" font-weight="700">
<tspan x="64" dy="0">Backend production workflow</tspan>
</text>
<text x="64" y="112" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#5c6b7a" text-anchor="start" font-weight="400">
<tspan x="64" dy="0">From an authorized website and creator brief to a reviewed, private video export.</tspan>
</text>
<text x="2216" y="72" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#5c6b7a" text-anchor="end" font-weight="600">
<tspan x="2216" dy="0">CITEREEL / 02</tspan>
</text>
