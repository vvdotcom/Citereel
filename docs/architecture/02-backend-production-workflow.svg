</text>
<text x="585.0" y="307" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#5c6b7a" text-anchor="middle" font-weight="400">
<tspan x="585.0" dy="0">Validate request + ownership</tspan>
<tspan x="585.0" dy="25">Persist idempotent job</tspan>
</text>
<path d="M730,312 L810,312" fill="none" stroke="#24313f" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow24313f)"/>
