<text x="215.0" y="266" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#24313f" text-anchor="middle" font-weight="600">
<tspan x="215.0" dy="0">Creator brief</tspan>
</text>
<text x="215.0" y="307" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#5c6b7a" text-anchor="middle" font-weight="400">
