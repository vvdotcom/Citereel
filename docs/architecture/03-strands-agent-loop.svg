</text>
<text x="2136" y="72" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#5c6b7a" text-anchor="end" font-weight="600">
<tspan x="2136" dy="0">CITEREEL / 03</tspan>
</text>
