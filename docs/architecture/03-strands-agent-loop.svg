</text>
<rect x="60" y="335" width="270" height="155" rx="6" fill="#eaf5ed" stroke="#6b9c7c" stroke-width="2"/>
<text x="195.0" y="371" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#24313f" text-anchor="middle" font-weight="600">
