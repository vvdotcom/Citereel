</text>
<text x="1030.0" y="412" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#5c6b7a" text-anchor="middle" font-weight="400">
<tspan x="1030.0" dy="0">Choose a scoped tool</tspan>
<tspan x="1030.0" dy="25">ProductionPolicy gate</tspan>
</text>
<rect x="1300" y="335" width="420" height="155" rx="6" fill="#fff7e6" stroke="#c89b58" stroke-width="2"/>
<text x="1510.0" y="371" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#24313f" text-anchor="middle" font-weight="600">
<tspan x="1510.0" dy="0">Tool execution</tspan>
</text>
<text x="1510.0" y="412" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#5c6b7a" text-anchor="middle" font-weight="400">
<tspan x="1510.0" dy="0">Return evidence, validation</tspan>
<tspan x="1510.0" dy="25">result or a saved plan</tspan>
</text>
<rect x="1890" y="335" width="260" height="185" rx="6" fill="#eaf5ed" stroke="#6b9c7c" stroke-width="2"/>
<text x="2020.0" y="371" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#24313f" text-anchor="middle" font-weight="600">
<tspan x="2020.0" dy="0">Worker receives result</tspan>
</text>
<text x="2020.0" y="412" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#5c6b7a" text-anchor="middle" font-weight="400">
<tspan x="2020.0" dy="0">Validated storyboard</tspan>
<tspan x="2020.0" dy="25">or human-decision pause</tspan>
</text>
