<text x="1804" y="395" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#6b9c7c" text-anchor="middle" font-weight="400">
<tspan x="1804" dy="0">Done</tspan>
</text>
<path d="M1510,490 L1510,604 L610,604 L610,490" fill="none" stroke="#c89b58" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrowc89b58)"/>
<rect x="842.0" y="570" width="456" height="28" rx="0" fill="white" stroke="none" stroke-width="0"/>
<text x="1070" y="590" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#c89b58" text-anchor="middle" font-weight="400">
<tspan x="1070" dy="0">Tool results and validation errors feed back</tspan>
</text>
<text x="420" y="659" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#5c6b7a" text-anchor="start" font-weight="400">
<tspan x="420" dy="0">Stop for a human decision or when execution limits are reached.</tspan>
</text>
<text x="60" y="772" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#24313f" text-anchor="start" font-weight="600">
<tspan x="60" dy="0">Four scoped tools</tspan>
</text>
<rect x="60" y="810" width="505" height="155" rx="6" fill="#edf3ff" stroke="#718ec4" stroke-width="2"/>
<text x="312.5" y="846" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#24313f" text-anchor="middle" font-weight="600">
<tspan x="312.5" dy="0">get_production_brief</tspan>
</text>
<text x="312.5" y="887" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#5c6b7a" text-anchor="middle" font-weight="400">
<tspan x="312.5" dy="0">Read format, audience, duration</tspan>
<tspan x="312.5" dy="25">and the creator&#x27;s call to action.</tspan>
</text>
<rect x="595" y="810" width="505" height="155" rx="6" fill="#fff7e6" stroke="#c89b58" stroke-width="2"/>
<text x="847.5" y="846" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#24313f" text-anchor="middle" font-weight="600">
<tspan x="847.5" dy="0">inspect_authorized_site</tspan>
</text>
<text x="847.5" y="887" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#5c6b7a" text-anchor="middle" font-weight="400">
<tspan x="847.5" dy="0">Read inspected site evidence;</tspan>
<tspan x="847.5" dy="25">page content is untrusted data.</tspan>
</text>
<rect x="1130" y="810" width="505" height="155" rx="6" fill="#f2ecfb" stroke="#9a7ac5" stroke-width="2"/>
<text x="1382.5" y="846" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#24313f" text-anchor="middle" font-weight="600">
<tspan x="1382.5" dy="0">submit_storyboard</tspan>
</text>
<text x="1382.5" y="887" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#5c6b7a" text-anchor="middle" font-weight="400">
<tspan x="1382.5" dy="0">Validate schema, sources and copy;</tspan>
<tspan x="1382.5" dy="25">save the plan and claim ledger.</tspan>
</text>
<rect x="1665" y="810" width="505" height="155" rx="6" fill="#eaf5ed" stroke="#6b9c7c" stroke-width="2"/>
<text x="1917.5" y="846" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#24313f" text-anchor="middle" font-weight="600">
<tspan x="1917.5" dy="0">request_human_decision</tspan>
</text>
<text x="1917.5" y="887" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#5c6b7a" text-anchor="middle" font-weight="400">
<tspan x="1917.5" dy="0">Record missing support or ambiguity;</tspan>
<tspan x="1917.5" dy="25">set a pending human decision.</tspan>
</text>
<path d="M64,1056 H2136" stroke="#d9e0e6"/>
<text x="64" y="1090" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#5c6b7a" text-anchor="start" font-weight="400">
<tspan x="64" dy="0">Planning limits: 8 turns, 45,000 total tokens, 10,000 output tokens and a maximum of 10 tool calls.</tspan>
<tspan x="64" dy="27">Source: services/agent/src/launchpad_agent/concierge.py, policies.py and runtime.py.</tspan>
</text>
</svg>