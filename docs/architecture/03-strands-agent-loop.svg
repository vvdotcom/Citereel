</text>
<rect x="460" y="335" width="300" height="155" rx="6" fill="#f2ecfb" stroke="#9a7ac5" stroke-width="2"/>
<text x="610.0" y="371" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#24313f" text-anchor="middle" font-weight="600">
<tspan x="610.0" dy="0">Reasoning (LLM)</tspan>
</text>
<text x="610.0" y="412" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#5c6b7a" text-anchor="middle" font-weight="400">
<tspan x="610.0" dy="0">Amazon Bedrock</tspan>
<tspan x="610.0" dy="25">Configured model</tspan>
</text>
<rect x="880" y="335" width="300" height="155" rx="6" fill="#edf3ff" stroke="#718ec4" stroke-width="2"/>
<text x="1030.0" y="371" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#24313f" text-anchor="middle" font-weight="600">
